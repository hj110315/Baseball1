<!doctype html>
<!-- Contact sheet of the player rigs, for checking animations by eye.
     Serve the repo root and open /tools/poses.html (add ?section=pitch etc. to
     show one section). Every body type x stance, every windup style at key
     frames, swing finishes and the reactions. -->
<html><head><meta charset="utf-8"><title>Pose sheet</title>
<style>body{margin:0;background:#3f8f45;font:12px sans-serif}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="../js/util.js"></script><script src="../js/data.js"></script><script src="../js/sim.js"></script>
<script src="../js/rig.js"></script><script src="../js/render-bat.js"></script>
<script>
const R = BB.rig;
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = 1800, H = 3560; c.width = W; c.height = H;
ctx.fillStyle = '#4caa52'; ctx.fillRect(0, 0, W, H);
let y0 = 0;
function band(h, title) {
  ctx.fillStyle = '#9fd8f2'; ctx.fillRect(0, y0, W, 26);
  ctx.fillStyle = '#c98a55'; ctx.fillRect(0, y0 + h - 40, W, 40);
  ctx.fillStyle = '#1d2433'; ctx.font = '700 15px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(title, 10, y0 + 18);
  const ty = y0; y0 += h; return ty;
}
function label(x, y, text) {
  ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(text, x, y + 18);
}
// Run a rig to time t in small steps so props, dust and blends evolve.
function at(rig, name, t, opts, seed) {
  rig.rand = BB.U.seeded(seed || 7);
  rig.play(name, 0, opts);
  rig.time = 0;
  const dt = 1 / 240;
  for (let s = 0; s < t - 1e-9; s += dt) rig.update(Math.min(dt, t - s));
  return rig;
}
const BODIES = ['athletic', 'lean', 'stocky', 'tall'];
const STANCES = ['upright', 'crouch', 'open', 'highHands'];
const WINDUPS = ['classic', 'overTop', 'sidearm', 'highKick'];
const team = ['#d64541', '#2f9bd9', '#e9b52c', '#6d4bb0'];
const WU = R.WINDUP;

// 1. Batters: every body x stance (mid-waggle).
let ty = band(470, 'Batters: body type (rows) x stance (columns), in the stance');
BODIES.forEach((b, r) => STANCES.forEach((s, i) => {
  const rig = at(R.makeBatter({ body: b, stance: s }), 'stance', 0.3);
  const x = 110 + i * 200 + (r % 2) * 0, y = ty + 140 + r * 0;
  const X = 60 + (r * 4 + i) * 108, Y = ty + 400;
  R.drawBatter(ctx, rig, X, Y, 17, team[i], 'R', 10 + r * 4 + i);
  label(X, Y + 6, b + ' / ' + s);
}));

// 2. Swing sequence per stance: load and swing key frames.
ty = band(800, 'Swings: load (gather, lift, launch) then swing (slot, contact, extend, follow, finish), one row per stance');
const swingFrames = [['load', 0.82 * WU], ['load', WU], ['load', WU + 0.2], ['swing', 0.018], ['swing', 0.04], ['swing', 0.1], ['swing', 0.2], ['swing', 0.36]];
STANCES.forEach((s, r) => swingFrames.forEach(([n, t], i) => {
  const rig = at(R.makeBatter({ stance: s, body: BODIES[r] }), n, t, { ballY: 2.55, ballX: 2.4 }, 3 + r);
  const X = 70 + i * 135 + (i > 2 ? 60 : 0), Y = ty + 210 + r * 180;
  R.drawBatter(ctx, rig, X, Y, 12, team[r], 'R', 27);
  label(X, Y + 4, s + ' ' + n + ' ' + t.toFixed(2));
}));

// 3. Windups: every style at key frames (fractions of the windup).
ty = band(900, 'Windups: set, lift, peak kick, drive, foot strike, layback, release, follow-through, recover (one row per style)');
const wf = (st) => { const T = R.STYLES[st].t; return [0, T[1], T[2], T[3], T[4], T[5], 1, 1 + 0.14 / WU, 1 + 0.4 / WU]; };
WINDUPS.forEach((st, r) => wf(st).forEach((f, i) => {
  const rig = at(R.makePitcher({ windup: st, body: r === 3 ? 'tall' : 'athletic' }), 'windup', f * WU, null, 11);
  const X = 80 + i * 190, Y = ty + 210 + r * 215;
  R.drawPitcher(ctx, rig, X, Y, 26, team[r], 'R');
  label(X, Y + 4, st + ' ' + f.toFixed(2) + 'W');
}));

// 4. Pitcher bodies and lefties at release.
ty = band(300, 'Pitchers at release: body types (right-handed), then left-handed styles');
BODIES.forEach((b, i) => {
  const rig = at(R.makePitcher({ windup: 'classic', body: b }), 'windup', WU, null, 5);
  const X = 90 + i * 180, Y = ty + 250;
  R.drawPitcher(ctx, rig, X, Y, 26, team[i], 'R'); label(X, Y + 4, b);
});
WINDUPS.forEach((st, i) => {
  const rig = at(R.makePitcher({ windup: st }), 'windup', WU * 0.97, null, 5);
  const X = 900 + i * 220, Y = ty + 250;
  R.drawPitcher(ctx, rig, X, Y, 26, '#6d4bb0', 'L'); label(X, Y + 4, 'LHP ' + st);
});

// 5. Reactions.
ty = band(1090, 'Reactions: home run (flip, point, fist, admire), strikeout walk-off, pitcher frustration, fist pumps, watching a homer');
const CEL = ['flip', 'point', 'fist', 'admire'];
CEL.forEach((cel, r) => [0.25, 0.48, 0.75, 1.3].forEach((t, i) => {
  const rig = at(R.makeBatter({ celebrate: cel, stance: STANCES[r] }), 'hr', t, { dir: 1 }, 2);
  const X = 70 + i * 120 + (r % 2) * 520, Y = ty + 230 + Math.floor(r / 2) * 200;
  R.drawBatter(ctx, rig, X, Y, 12, team[r], 'R', 4 + r);
  label(X, Y + 4, 'HR ' + cel + ' ' + t);
}));
[[0.3, false], [0.8, false], [1.4, false], [0.45, true], [1.0, true]].forEach(([t, looking], i) => {
  const rig = at(R.makeBatter({ stance: 'crouch' }), 'kWalk', t, { looking }, looking ? 1 : 4);
  const X = 1120 + i * 130, Y = ty + 230;
  R.drawBatter(ctx, rig, X, Y, 12, '#2f9bd9', 'R', 33);
  label(X, Y + 4, 'K ' + (looking ? 'looking ' : '') + t);
});
// Pitcher frustration: three variants picked by seed.
[[1, 0.3], [1, 0.9], [2, 0.5], [2, 0.66], [3, 0.35], [3, 0.6]].forEach(([seed, t], i) => {
  const rig = at(R.makePitcher({}), 'frustrate', t, null, [0, 3, 1, 2][seed]);
  const X = 80 + i * 150, Y = ty + 700;
  R.drawPitcher(ctx, rig, X, Y, 26, '#d64541', 'R');
  label(X, Y + 4, 'frustrate v' + seed + ' ' + t);
});
[[0, 0.18], [0, 0.32], [1, 0.4], [4, 0.2], [4, 0.6]].forEach(([seed, t], i) => {
  const rig = at(R.makePitcher({}), 'pump', t, null, seed);
  const X = 980 + i * 150, Y = ty + 700;
  R.drawPitcher(ctx, rig, X, Y, 26, '#17908a', 'R');
  label(X, Y + 4, 'pump s' + seed + ' ' + t);
});
[0.15, 0.36, 0.56].forEach((t, i) => {
  const rig = at(R.makePitcher({}), 'pump', t, { final: true }, 1);
  const X = 80 + i * 150, Y = ty + 1020;
  R.drawPitcher(ctx, rig, X, Y, 26, '#e9b52c', 'R');
  label(X, Y + 4, 'final out ' + t);
});
[0.3, 1.0].forEach((t, i) => {
  const rig = at(R.makePitcher({}), 'watch', t, null, 1);
  const X = 560 + i * 150, Y = ty + 1020;
  R.drawPitcher(ctx, rig, X, Y, 26, '#2f9bd9', 'R');
  label(X, Y + 4, 'watch ' + t);
});
[0.25, 0.9, 1.4].forEach((t, i) => {
  const rig = at(R.makeBatter({ stance: 'open' }), 'enter', t, null, 1);
  const X = 980 + i * 150, Y = ty + 1020;
  R.drawBatter(ctx, rig, X, Y, 12, '#ec7a2c', 'R', 8);
  label(X, Y + 4, 'enter ' + t);
});
window.done = true;
</script></body></html>
